{% extends "base.html" %}

{% block title %}Login - Smart Attendance System{% endblock %}

{% block content %}
<div class="container animate-fade-in" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="glass-card" style="width: 100%; max-width: 440px; border-radius: 24px; padding: 40px 32px; border-color: rgba(255, 255, 255, 0.05);">
        
        <!-- Logo and Title -->
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); margin-bottom: 16px; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);">
                <i class="fa-solid fa-user-shield" style="font-size: 1.75rem; color: white;"></i>
            </div>
            <h2 style="font-size: 1.75rem; margin-bottom: 6px; color: white;">Portal Sign In</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Access your dashboard controls</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <!-- Email Field -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div style="position: relative;">
                    <i class="fa-regular fa-envelope" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@school.edu" required style="padding-left: 48px;">
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="padding-left: 48px;">
                </div>
            </div>

            <!-- Login Action Button -->
            <button type="submit" class="btn btn-primary" style="width: 100%; height: 48px; border-radius: 10px; margin-bottom: 20px;">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket" style="font-size: 0.95rem;"></i>
            </button>

            <!-- Secondary Signup Prompt -->
            <div style="text-align: center; border-top: 1px solid var(--border-glass); padding-top: 20px;">
                <p style="font-size: 0.85rem; color: var(--text-secondary);">
                    Don't have a teacher account? 
                    <a href="{{ url_for('auth.register') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Teacher</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
